name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit + integration on Postgres/Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: reviewpilot, POSTGRES_PASSWORD: reviewpilot_ci_only, POSTGRES_DB: reviewpilot }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U reviewpilot" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://reviewpilot:reviewpilot_ci_only@127.0.0.1:5432/reviewpilot
      TEST_DATABASE_URL: postgresql://reviewpilot:reviewpilot_ci_only@127.0.0.1:5432/reviewpilot_test
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, types, unit, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build # also generates next-env.d.ts and route types used by tsc
      - run: npm run typecheck
      - run: npm test
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E (real worker + SSE, fixture LLM)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: reviewpilot, POSTGRES_PASSWORD: reviewpilot_ci_only, POSTGRES_DB: reviewpilot }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U reviewpilot" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://reviewpilot:reviewpilot_ci_only@127.0.0.1:5432/reviewpilot_e2e
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile app build

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
